[package]
name = "darkpool-wrap"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Minimal 1:1 Token-2022 wrapper (create_wrapped_mint / wrap / unwrap), pinocchio port of SPL token-wrap logic"
repository = "https://github.com/sipLinchik/darkpool-wrap"

[lib]
crate-type = ["cdylib"]

[features]
no-entrypoint = []

[dependencies]
pinocchio = { version = "=0.11.2", features = ["cpi"] }
solana-address = { version = "2", features = ["decode", "syscalls"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
overflow-checks = true
panic = "abort"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("solana"))']
